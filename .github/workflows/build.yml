name: Build EnglishPath APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'EnglishPath-Android.zip'
      - '.github/workflows/build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack Android project
        run: unzip -q EnglishPath-Android.zip -d workspace

      - name: Pin compatible Android libraries
        run: |
          APP_GRADLE="workspace/EnglishPath-Android/app/build.gradle.kts"
          test -f "$APP_GRADLE"
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.08.00/' "$APP_GRADLE"
          sed -i 's/activity-compose:1.12.4/activity-compose:1.10.1/' "$APP_GRADLE"
          grep -q 'compose-bom:2025.08.00' "$APP_GRADLE"
          grep -q 'activity-compose:1.10.1' "$APP_GRADLE"
          grep 'compose-bom:\|activity-compose:' "$APP_GRADLE"

      - name: Compile installable debug APK
        run: gradle --no-daemon -p workspace/EnglishPath-Android :app:assembleDebug

      - name: Upload EnglishPath APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPath-APK
          path: workspace/EnglishPath-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
